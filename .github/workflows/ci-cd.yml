name: CI CD

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ci
      LOG_LEVEL: INFO
      AUTH_SIGNING_KEY: ci-test-signing-key-ci-test-signing-key
      GOOGLE_API_KEY: ci-test-google-api-key
      CORS_ORIGINS: http://localhost:3000
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r backend/requirements.txt
          python -m compileall backend/app
      - run: |
          . .venv/bin/activate
          PYTHONPATH=backend python - <<'PY'
          # Import the full app (not just app.config) so a missing
          # dependency or bad import anywhere in the app surfaces here,
          # not as a boot failure in the deployed container.
          from app.main import app
          from app.config import get_settings
          get_settings()
          PY

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
